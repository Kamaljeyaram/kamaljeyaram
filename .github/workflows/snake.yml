name: Generate contribution snake

on:
  schedule:
    - cron: "0 0 * * *" # daily at 00:00 UTC
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#111111&color_dots=#EBE6DC,#FFC9BC,#FF9A80,#FF6A4A,#D93A1C
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#FF4D2E&color_dots=#1C1A18,#4A2017,#8A2E1B,#D13F22,#FF6A4A

      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
